spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/reading_assistant?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

gemini:
  api-key: ${GEMINI_API_KEY}